            width: 100%;

                background-image: linear-gradient(180deg, rgba(18, 18, 18, 0) 50%, rgba(18, 18, 18, 0.8) 75%, rgba(18,
                18, 18, 1) 100%) !important; */
            background-repeat: repeat-x !important;

        .campus-actions-items {
            position: absolute;
            z-index: 2;
            bottom: 0;
            text-align: center;
            width: 100%;

        .se-btn--app-highlight {
